[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-generative"
version = "0.1.0"
description = "Pipeline reproducible de datos y modelos generativos para simulación cripto"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "torch>=2.1",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
notebooks = [
    "jupyter>=1.0",
    "pandas>=2.0",
]
cvae = [
    "tensorflow>=2.16",
    "keras>=3.0",
    "matplotlib>=3.7",
    "pandas>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
