[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-generative"
version = "0.1.0"
description = "Pipeline reproducible de datos y modelos generativos para simulación cripto"
requires-python = "==3.11.*"
dependencies = [
    "numpy==2.4.6",
    "torch==2.13.0",
    "tensorflow==2.21.0",
    "matplotlib==3.11.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]
notebooks = [
    "jupyter==1.1.1",
    "pandas==3.0.5",
]
cvae = [
    "keras==3.15.1",
    "pandas==3.0.5",
]

[tool.uv]
required-version = "==0.11.24"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
